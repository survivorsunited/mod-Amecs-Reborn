name: Build and release 1.21.11
# This workflow is mirrored on main and the 1.21.11 branch so branch pushes can build and publish the 1.21.11 release.

on:
  push:
    branches:
      - "1.21.11"
  pull_request:
    branches:
      - "1.21.11"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: amecs-reborn-1.21.11-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build 1.21.11 jar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean build

      - name: Prepare release files
        run: |
          set -euo pipefail
          mkdir -p release

          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | sort)
          if [ "${#jars[@]}" -eq 0 ]; then
            echo "No release jar found in build/libs" >&2
            find build/libs -maxdepth 1 -type f -print >&2 || true
            exit 1
          fi

          for jar in "${jars[@]}"; do
            cp "$jar" release/
          done

          (cd release && sha256sum *.jar > SHA256SUMS.txt)

      - name: Validate built metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import json
          import zipfile

          jars = sorted(
              jar for jar in glob.glob('release/*.jar')
              if not jar.endswith('-sources.jar') and not jar.endswith('-dev.jar')
          )
          if not jars:
              raise SystemExit('No release jar to validate')

          expected_mc = '1.21.11'
          for jar in jars:
              with zipfile.ZipFile(jar) as zf:
                  mod = json.loads(zf.read('fabric.mod.json'))
                  if mod['depends']['minecraft'] != expected_mc:
                      raise SystemExit(f'{jar}: expected minecraft {expected_mc}, got {mod["depends"]["minecraft"]}')

                  mixins = json.loads(zf.read('amecs.mixins.json'))
                  client_mixins = mixins.get('client', [])
                  blocked = [m for m in client_mixins if m.startswith('compat.')]
                  if blocked:
                      raise SystemExit(f'{jar}: unported Controlling compat mixins are still enabled: {blocked}')

          print(f'Validated {len(jars)} release jar(s) for Minecraft {expected_mc}')
          PY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: amecs-reborn-1.21.11
          path: release/*
          if-no-files-found: error

      - name: Publish branch release
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/1.21.11') || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mod_version="$(grep '^mod_version' gradle.properties | cut -d= -f2- | xargs)"
          minecraft_version="$(grep '^minecraft_version' versions/1.21.11/gradle.properties | cut -d= -f2- | xargs)"
          release_tag="branch-1.21.11"
          release_title="Amecs Reborn ${mod_version} for Minecraft ${minecraft_version}"

          cat > release/RELEASE_NOTES.md <<EOF
          # ${release_title}

          Built automatically from the \`1.21.11\` branch at commit \`${GITHUB_SHA}\`.

          ## Validation

          - Ran \`./gradlew --no-daemon clean build\`.
          - Checked \`fabric.mod.json\` declares Minecraft \`${minecraft_version}\`.
          - Checked unported Controlling compat mixins are not enabled in the 1.21.11 release jar.
          - SHA256 checksums are attached in \`SHA256SUMS.txt\`.

          ## Notes

          Controlling compatibility is intentionally disabled on this branch until it is ported to the 1.21.11 Controlling key event API.
          EOF

          gh release delete "$release_tag" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${release_tag}" >/dev/null 2>&1 || true

          gh release create "$release_tag" \
            release/*.jar \
            release/SHA256SUMS.txt \
            --title "$release_title" \
            --notes-file release/RELEASE_NOTES.md \
            --target "$GITHUB_SHA" \
            --latest
