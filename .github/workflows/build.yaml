name: build

on:
  push:
  pull_request:

jobs:
  build:
    name: build
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: validate gradle wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: setup jdk 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build active branch target
        run: |
          set +e
          ./gradlew --no-daemon clean build --stacktrace --console=plain 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "Gradle exit code: ${status}"
          echo "---- Last 250 lines of build.log ----"
          tail -n 250 build.log || true
          exit ${status}

      - name: capture build artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: |
            build.log
            build/libs/*.jar
            versions/**/build/libs/*.jar
          if-no-files-found: ignore
