name: Build and release 1.21.11
# This workflow is mirrored on main and the 1.21.11 branch so branch pushes can build and publish the 1.21.11 release.

on:
  push:
    branches:
      - "1.21.11"
  pull_request:
    branches:
      - "1.21.11"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: amecs-reborn-1.21.11-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build 1.21.11 jar
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build active 1.21.11 source node
        run: |
          set +e
          chmod +x ./gradlew
          ./gradlew --no-daemon :1.21.11:clean :1.21.11:build --stacktrace --console=plain 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "Gradle exit code: ${status}"
          echo "---- Last 250 lines of build.log ----"
          tail -n 250 build.log || true
          exit ${status}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Test controls without Controlling
        run: |
          xvfb-run -a ./gradlew --no-daemon :1.21.11:runControlsTest --console=plain 2>&1 | tee controls-vanilla.log
          grep -q 'AMECS_CONTROLS_TEST_PASS controlling=false' controls-vanilla.log

      - name: Test controls with Controlling
        run: |
          xvfb-run -a ./gradlew --no-daemon :1.21.11:runControlsTest -PwithControlling --console=plain 2>&1 | tee controls-controlling.log
          grep -q 'AMECS_CONTROLS_TEST_PASS controlling=true' controls-controlling.log

      - name: Upload client test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controls-test-evidence
          path: |
            controls-*.log
            versions/1.21.11/run-controls-test/screenshots/*.png
            versions/1.21.11/run-controls-test/crash-reports/*
          if-no-files-found: ignore

      - name: Prepare release files
        run: |
          set -euo pipefail
          mkdir -p release

          mapfile -t jars < <(find versions/1.21.11/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | sort)
          if [ "${#jars[@]}" -eq 0 ]; then
            echo "No release jar found in versions/1.21.11/build/libs" >&2
            find versions/1.21.11/build/libs -maxdepth 1 -type f -print >&2 || true
            exit 1
          fi

          for jar in "${jars[@]}"; do
            cp "$jar" release/
          done

          (cd release && sha256sum *.jar > SHA256SUMS.txt)

      - name: Validate built metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import json
          import zipfile

          jars = sorted(
              jar for jar in glob.glob('release/*.jar')
              if not jar.endswith('-sources.jar') and not jar.endswith('-dev.jar')
          )
          if not jars:
              raise SystemExit('No release jar to validate')

          expected_mc = '1.21.11'
          for jar in jars:
              with zipfile.ZipFile(jar) as zf:
                  mod = json.loads(zf.read('fabric.mod.json'))
                  if mod['depends']['minecraft'] != expected_mc:
                      raise SystemExit(f'{jar}: expected minecraft {expected_mc}, got {mod["depends"]["minecraft"]}')

                  mixins = json.loads(zf.read('amecs.mixins.json'))
                  client_mixins = mixins.get('client', [])
                  if 'MixinEntryListWidget' not in client_mixins:
                      raise SystemExit(f'{jar}: controls search mixin missing')
                  if 'de/siphalor/amecs/compat/ControllingCompat.class' not in zf.namelist():
                      raise SystemExit(f'{jar}: Controlling event integration missing')
                  if any('/test/' in name for name in zf.namelist()):
                      raise SystemExit(f'{jar}: development test classes leaked into release')

          print(f'Validated {len(jars)} release jar(s) for Minecraft {expected_mc}')
          PY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: amecs-reborn-1.21.11
          path: release/*
          if-no-files-found: error

      - name: Publish branch release
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/1.21.11') || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mod_version="$(grep '^mod_version' gradle.properties | cut -d= -f2- | xargs)"
          minecraft_version="$(grep '^minecraft_version' versions/1.21.11/gradle.properties | cut -d= -f2- | xargs)"
          release_tag="v${mod_version}-mc${minecraft_version}"
          release_title="Amecs Reborn ${mod_version} for Minecraft ${minecraft_version}"

          cat > release/RELEASE_NOTES.md <<EOF
          # ${release_title}

          Built automatically from the \`1.21.11\` branch at commit \`${GITHUB_SHA}\`.

          ## Validation

          - Ran \`./gradlew --no-daemon :1.21.11:clean :1.21.11:build\`.
          - Checked \`fabric.mod.json\` declares Minecraft \`${minecraft_version}\`.
          - Verified controls search and optional Controlling integration are packaged.
          - SHA256 checksums are attached in \`SHA256SUMS.txt\`.

          ## Notes

          Restores controls search and modifier bindings/reset support with Controlling 29.0.1 for Minecraft 1.21.11. Controlling and Searchables remain optional and are not bundled.
          EOF


          gh release create "$release_tag" \
            release/*.jar \
            release/SHA256SUMS.txt \
            --title "$release_title" \
            --notes-file release/RELEASE_NOTES.md \
            --target "$GITHUB_SHA" \
            --latest
